name: MLflow Project CI Workflow

on:
  push:
    branches:
      - main
      - master

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Check Env
      run: |
        python --version
        pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas mlflow==2.19.0 scikit-learn dagshub matplotlib

    - name: Run mlflow project
      env:
        DAGSHUB_CLIENT_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        cd MLProject
        python modelling.py
        
    - name: Get latest MLflow run_id
      run: |
        echo "Mengambil run ID terbaru untuk kebutuhan build docker image..."

    - name: Install Python dependencies
      run: |
        echo "Memastikan semua dependencies build image siap..."

    - name: Upload to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: |
          MLProject/training_confusion_matrix.png
          MLProject/metric_info.json

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Model
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/pijak-model:latest -f - . <<EOF
        FROM python:3.12-slim
        RUN pip install mlflow==2.19.0 pandas scikit-learn
        COPY MLProject/ /app/
        WORKDIR /app
        CMD ["python", "modelling.py"]
        EOF

    - name: Tag Docker Image
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/pijak-model:latest ${{ secrets.DOCKER_USERNAME }}/pijak-model:1.0.0

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/pijak-model:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/pijak-model:1.0.0
